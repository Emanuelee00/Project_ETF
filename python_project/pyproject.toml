[project]
name = "etf-portfolio-analyzer"
version = "0.1.0"
description = "Multi-asset portfolio analytics, strategy backtesting, risk and optimization with a FastAPI web UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.44",
    "python-multipart>=0.0.26",
    "pandas>=2.3",
    "numpy>=1.26",
    "plotly>=6.5",
    "yfinance>=1.2",
    "openpyxl>=3.1",
    "requests>=2.32",
]
